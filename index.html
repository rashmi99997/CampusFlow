<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CampusFlow - Student Workspace</title>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h2>CampusFlow</h2>
                <span class="badge">STUDENT WORKSPACE</span>
            </div>
            <nav class="nav-links">
                <a href="#" class="active">Dashboard</a>
                <a href="#">Timetable</a>
                <a href="#">Assignments</a>
                <a href="#">Study Tracker</a>
                <a href="#">Progress</a>
            </nav>
        </aside>

        <!-- Main Dashboard Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1>Good morning!</h1>
                <p>Here's your academic overview.</p>
            </header>

            <!-- Summary Cards -->
        <section class="stats-grid">
            <div class="card">
                <h3 id="pending-count">08</h3>
                <p>Pending tasks</p>
            </div>
            <div class="card">
                <h3 id="completed-count">05</h3>
                <p>Completed</p>
            </div>
            <div class="card">
                <h3 id="upcoming-count">03</h3>
                <p>Upcoming deadlines</p>
            </div>
            <div class="card">
                <h3>2.5h</h3>
                <p>Studied today</p>
            </div>
        </section>

            <!-- Today's Tasks Section -->
            <!-- Today's Tasks Section -->
        <section class="tasks-section">
            <div class="section-header">
                <h2>Today's Tasks</h2>
            </div>

            <!-- Input form area that stays permanently on the page -->
            <div class="task-input-container" style="margin-bottom: 20px; display: flex; gap: 10px;">
                <input type="text" id="task-input" placeholder="What needs to be done?" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
                <button id="add-task-btn" style="padding: 10px 20px; background-color: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;">+ Add New Task</button>
            </div>
            
            <!-- This container is strictly for the dynamic task cards -->
            <div class="task-list"></div>
        </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
